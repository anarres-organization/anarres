name: Bug report
description: Report reproducible incorrect behavior
title: "[Bug]: "
labels: [bug]
body:
  - type: textarea
    attributes:
      label: Behavior
      description: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    attributes:
      label: Reproduction
      description: Provide the smallest safe reproduction and relevant manifest identifiers.
    validations:
      required: true
  - type: textarea
    attributes:
      label: Environment
      description: Include Anarres revision, Python version, and relevant backend versions. Do not include credentials.
    validations:
      required: true
  - type: checkboxes
    attributes:
      label: Safety
      options:
        - label: This report does not expose credentials or a sandbox escape.
          required: true
