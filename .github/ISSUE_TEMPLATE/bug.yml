name: Bug report
description: Report reproducible incorrect behavior
title: "[Bug]: "
labels: [bug]
body:
  - type: dropdown
    attributes:
      label: Area
      description: Where did the problem occur?
      options:
        - CLI or adapter framework
        - Environment processing
        - Documentation or website
        - Domain workflow
        - Release or installation
        - Unsure
    validations:
      required: true
  - type: textarea
    attributes:
      label: Behavior
      description: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    attributes:
      label: Reproduction
      description: Provide the smallest safe reproduction and relevant manifest identifiers.
    validations:
      required: true
  - type: textarea
    attributes:
      label: Environment
      description: Include the Anarres revision, CLI version, operating system, and relevant adapter or backend versions. Do not include credentials.
    validations:
      required: true
  - type: checkboxes
    attributes:
      label: Safety
      options:
        - label: This report does not expose credentials or a sandbox escape.
          required: true
