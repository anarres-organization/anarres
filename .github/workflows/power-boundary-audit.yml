name: Exact statistical power boundary audit

on:
  push:
    branches:
      - contrib/verifier-reliability-pilot
    paths:
      - "experiments/mathematics/verifier-reliability-pilot/**"
      - "tests/integration/test_verifier_reliability_power_boundaries.py"
      - ".github/workflows/power-boundary-audit.yml"

permissions:
  contents: read

jobs:
  exact-power:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Show exact SHA-256 for manifest update
        run: sha256sum experiments/mathematics/verifier-reliability-pilot/scripts/detectable_difference.py
      - name: Regression tests for exact test-power endpoints
        run: python -m unittest discover -s tests/integration -p test_verifier_reliability_power_boundaries.py -v
      - name: Recompute released McNemar counts
        run: python experiments/mathematics/verifier-reliability-pilot/scripts/recompute_exact_mcnemar.py
      - name: Recompute published experimental resolution
        run: python experiments/mathematics/verifier-reliability-pilot/scripts/detectable_difference.py
      - uses: astral-sh/setup-uv@v7
      - name: Verify workspace Python formatting and lint
        run: make lint
      - name: Install all workspace command tools
        run: uv sync --all-packages --dev
      - name: Reproduce every published compact scientific study
        run: make study-check
      - name: Verify four-file study release manifest
        working-directory: experiments/mathematics/verifier-reliability-pilot
        run: sha256sum --check MANIFEST.sha256
