name: Quality

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  fast-checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: Prepare Rust checks
        run: |
          rustup component add rustfmt clippy
          rustup toolchain install 1.85.1 --profile minimal
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}
      - name: Install workspace
        run: make setup
      - name: Run fast checks
        run: make check
      - name: Exercise the release binary
        run: make release-smoke adapter-smoke
      - name: Check minimum Rust version
        run: cargo +1.85.1 check --workspace --locked
