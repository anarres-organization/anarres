name: Security

on:
  pull_request:
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "crates/**/Cargo.toml"
  push:
    branches: [main]
  schedule:
    - cron: "23 9 * * 1"

permissions:
  actions: read
  contents: read
  packages: read
  security-events: write

jobs:
  rust-audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Install cargo-audit
        run: cargo install cargo-audit --version 0.22.2 --locked
      - name: Audit Rust dependencies
        run: cargo audit --file Cargo.lock

  codeql:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: github/codeql-action/init@v4
        with:
          languages: python
      - uses: github/codeql-action/analyze@v4
        with:
          output: results
          upload: ${{ github.event.repository.private && 'never' || 'always' }}
          upload-database: ${{ !github.event.repository.private }}
      - name: Retain private-repository scan results
        if: ${{ github.event.repository.private }}
        uses: actions/upload-artifact@v7
        with:
          name: codeql-sarif
          path: results/*.sarif
          retention-days: 30
