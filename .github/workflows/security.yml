name: Security

on:
  push:
    branches: [main]
  schedule:
    - cron: "23 9 * * 1"

permissions:
  actions: read
  contents: read
  packages: read
  security-events: write

jobs:
  codeql:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: github/codeql-action/init@v4
        with:
          languages: python
      - uses: github/codeql-action/analyze@v4
        with:
          output: results
          upload: ${{ github.event.repository.private && 'never' || 'always' }}
      - name: Retain private-repository scan results
        if: ${{ github.event.repository.private }}
        uses: actions/upload-artifact@v4
        with:
          name: codeql-sarif
          path: results/*.sarif
          retention-days: 30
