[package]
name = "anarres-cli"
version = "0.4.0"
description = "Native command line interface for Anarres environment workflows"
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage = "https://github.com/anarres-organization/anarres"
rust-version.workspace = true
publish = false

[package.metadata.dist]
dist = true
formula = "anarres"

[[bin]]
name = "anarres"
path = "src/main.rs"

[dependencies]
anstream = "1.0"
anstyle = "1.0"
clap = { version = "4.5", features = ["derive"] }
clap_complete = "4.5"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.11"
toml = "0.9"
