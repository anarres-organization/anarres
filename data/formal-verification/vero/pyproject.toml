[project]
name = "anarres-formal"
version = "0.1.0"
description = "Anarres adapter for the released Vero development measurement"
requires-python = ">=3.11"
dependencies = ["anarres-core", "anarres-environments"]
license = { text = "Apache-2.0" }

[project.scripts]
anarres-formal = "anarres_formal_adapter.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/anarres_formal_adapter"]
