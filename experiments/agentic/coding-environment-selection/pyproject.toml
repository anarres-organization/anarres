[project]
name = "anarres-coding"
version = "0.1.0"
description = "Anarres adapter for released agentic-coding environment studies"
requires-python = ">=3.11"
dependencies = ["anarres-core"]
license = { text = "Apache-2.0" }

[project.scripts]
anarres-coding = "anarres_coding_adapter.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/anarres_coding_adapter"]
