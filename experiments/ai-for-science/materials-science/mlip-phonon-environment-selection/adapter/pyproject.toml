[project]
name = "anarres-materials"
version = "0.2.0"
description = "Study adapter for Anarres MLIP environment measurements"
requires-python = ">=3.11"
dependencies = ["anarres-environments"]
license = { text = "Apache-2.0" }

[project.scripts]
anarres-materials = "anarres_materials_adapter.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/anarres_materials_adapter"]
