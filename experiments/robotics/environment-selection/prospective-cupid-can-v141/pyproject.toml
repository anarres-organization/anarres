[project]
name = "anarres-robotics"
version = "0.1.0"
description = "Anarres adapter for the released CUPID Can v1.4.1 study"
requires-python = ">=3.11"
dependencies = ["anarres-environments"]
license = { text = "Apache-2.0" }

[project.scripts]
anarres-robotics = "anarres_robotics_adapter.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/anarres_robotics_adapter"]
