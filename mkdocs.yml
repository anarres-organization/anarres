site_name: Anarres
site_description: Measure and compare training environments before committing the full training budget.
site_url: https://anarres.world/
repo_url: https://github.com/anarres-organization/anarres
repo_name: anarres-organization/anarres
edit_uri: edit/main/docs/
copyright: Anarres is released under the Apache License 2.0.

exclude_docs: |
  first-run-evaluation.md
  standards/writing.md

theme:
  name: material
  logo: assets/anarres-logo.jpeg
  favicon: assets/anarres-logo.jpeg
  features:
    - navigation.path
    - navigation.instant
    - navigation.instant.prefetch
    - navigation.instant.progress
    - navigation.sections
    - navigation.indexes
    - navigation.tracking
    - navigation.top
    - navigation.footer
    - toc.follow
    - content.code.copy
    - content.tabs.link
  palette:
    - scheme: default
      primary: black
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: black
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

plugins:
  - search

extra_css:
  - stylesheets/anarres.css

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - toc:
      permalink: true

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/anarres-organization/anarres
      name: Anarres on GitHub
  generator: false

nav:
  - Home: index.md
  - Get started:
      - Overview: getting-started.md
      - CLI guide: cli.md
      - Domain workflows: adapters.md
      - Releases and installation: releases.md
  - Guides:
      - Domain support: domain-support.md
      - Performance: performance.md
      - Measurement conventions: conventions/README.md
  - Architecture:
      - Repository: architecture/repository.md
      - Scientific preservation: architecture/scientific-preservation.md
      - Domain adapters: architecture/domain-adapters.md
      - Adapter authoring: architecture/adapter-authoring.md
  - Research standards:
      - Artifacts: standards/artifacts.md
      - Reproducibility: standards/reproducibility.md
