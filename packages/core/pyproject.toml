[project]
name = "anarres-core"
version = "0.1.0"
description = "Shared contracts and identifiers for Anarres"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/anarres"]
