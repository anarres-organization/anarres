[project]
name = "anarres-environments"
version = "0.1.0"
description = "Environment ingestion, qualification, measurement, and composition for Anarres"
requires-python = ">=3.11"
dependencies = ["anarres-core"]
license = { text = "Apache-2.0" }

[project.scripts]
anarres-env = "anarres.environments.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/anarres"]
