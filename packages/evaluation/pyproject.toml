[project]
name = "anarres-evaluation"
version = "0.1.0"
description = "Evaluation metrics and scoring contracts for Anarres"
requires-python = ">=3.11"
dependencies = ["anarres-core"]
license = { text = "Apache-2.0" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/anarres"]
