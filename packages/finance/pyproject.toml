[project]
name = "anarres-finance"
version = "0.2.0"
description = "Domain adapter and reproducibility commands for Anarres finance studies"
requires-python = ">=3.11"
dependencies = ["anarres-core", "anarres-environments", "PyYAML>=6.0"]
license = { text = "Apache-2.0" }

[project.scripts]
anarres-finance = "anarres.finance.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/anarres"]
