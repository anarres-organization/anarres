[project]
name = "anarres-legal"
version = "0.1.1"
description = "Domain adapter for released Anarres legal-reasoning studies"
requires-python = ">=3.11"
dependencies = ["anarres-environments"]
license = { text = "Apache-2.0" }

[project.scripts]
anarres-legal = "anarres.legal.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/anarres"]
