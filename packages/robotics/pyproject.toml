[project]
name = "anarres-robotics"
version = "0.6.0"
description = "Study-independent robotics adapter for Anarres"
requires-python = ">=3.11"
dependencies = ["anarres-core", "anarres-environments"]
license = { text = "Apache-2.0" }

[project.scripts]
anarres-robotics = "anarres.robotics.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/anarres"]
